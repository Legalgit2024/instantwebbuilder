<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ElevenLabs Talk</title>
    <meta property="og:title" content="ElevenLabs Talk Chat">
    <meta property="og:description" content="Chat with AI Assistant">
    <meta property="og:type" content="website">
    <style>
        :root {
            --primary-color: #5436DA;
            --text-color: #FFFFFF;
            --bg-dark: #0a0a1f;
            --glass-bg: rgba(10, 14, 25, 0.75);
            --card-bg: rgba(10, 14, 25, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1f 0%, #070714 100%);
            min-height: 100vh;
            color: var(--text-color);
            line-height: 1.5;
            letter-spacing: 0.015em;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: -0.02em;
        }

        #app-container {
            max-width: 1400px;
            margin: 80px auto 0;
            padding: 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        #sidebar {
            background: var(--glass-bg);
            border-radius: 16px;
            padding: 1.5rem;
            height: fit-content;
            border: 1px solid var(--border-color);
        }

        #logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .action-btn, #new-chat-button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            width: 100%;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .action-btn:hover, #new-chat-button:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #chat-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 0.75rem;
            margin-bottom: 0.25rem;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .chat-item.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .chat-item:hover {
            background: var(--hover-color);
        }

        #chat-container {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);
        }

        #chat-header {
            background: var(--glass-bg);
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #chat-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            flex-grow: 1;
        }

        #share-button {
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        #share-button:hover {
            background: var(--hover-color);
        }

        #messages {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 1rem;
            max-width: 80%;
        }

        .message .meta {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        .message p {
            background: var(--glass-bg);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin: 0;
        }

        .message.user {
            margin-left: auto;
        }

        .message.user p {
            background: var(--primary-color);
            border: none;
        }

        #input-area {
            padding: 1.5rem;
            background: var(--glass-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        #message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            min-height: 45px;
            max-height: 150px;
            resize: none;
        }

        #message-input:focus {
            border-color: var(--primary-color);
        }

        #send-button {
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            padding: 0 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #send-button:hover {
            opacity: 0.9;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass-bg);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            display: none;
            z-index: 1000;
        }

        @media (max-width: 1024px) {
            #app-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            #app-container {
                padding: 1rem;
                margin-top: 70px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">ElevenLabs Talk</div>
        <div class="action-buttons">
            <button class="action-btn" id="new-chat-btn">New Chat</button>
            <button class="action-btn">Settings</button>
        </div>
    </header>

    <div id="app-container">
        <div id="sidebar">
            <div id="logo">Chat History</div>
            <button id="new-chat-button">+ New Chat</button>
            <div id="chat-list"></div>
        </div>
        <div id="chat-container">
            <div id="chat-header">
                <h2 id="chat-title">Chat with AI Assistant</h2>
                <button id="share-button" onclick="shareLink()">Share Chat</button>
            </div>
            <div id="messages">
                <div class="message">
                    <div class="meta">AI Assistant • Just now</div>
                    <p>Hello! How can I help you today?</p>
                </div>
            </div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Type your message here...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Chat link copied to clipboard!</div>

    <script>
        // Initialize chat history
        let chats = JSON.parse(localStorage.getItem('chats')) || [{
            id: 'chat-1',
            title: 'New Chat',
            messages: [{
                sender: 'assistant',
                text: 'Hello! How can I help you today?',
                timestamp: new Date().toLocaleString()
            }]
        }];
        let currentChatId = chats[0].id;

        // DOM Elements
        const chatList = document.getElementById('chat-list');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const newChatButton = document.getElementById('new-chat-button');
        const newChatHeaderBtn = document.getElementById('new-chat-btn');
        const toast = document.getElementById('toast');

        // Load chat list
        function loadChatList() {
            chatList.innerHTML = '';
            chats.forEach(chat => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
                chatItem.textContent = chat.title;
                chatItem.onclick = () => switchChat(chat.id);
                chatList.appendChild(chatItem);
            });
        }

        // Load messages for current chat
        function loadMessages() {
            messagesDiv.innerHTML = '';
            const currentChat = chats.find(chat => chat.id === currentChatId);
            currentChat.messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message' + (message.sender === 'user' ? ' user' : '');
                
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                metaDiv.textContent = `${message.sender === 'user' ? 'You' : 'AI Assistant'} • ${message.timestamp}`;
                
                const contentP = document.createElement('p');
                contentP.textContent = message.text;
                
                messageDiv.appendChild(metaDiv);
                messageDiv.appendChild(contentP);
                messagesDiv.appendChild(messageDiv);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Share functionality
        function shareLink() {
            const url = new URL(window.location.href);
            url.searchParams.set('chatId', currentChatId);
            navigator.clipboard.writeText(url.toString()).then(() => {
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        }

        // Switch to a different chat
        function switchChat(chatId) {
            currentChatId = chatId;
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('chatId', chatId);
            window.history.pushState({}, '', newUrl);
            loadChatList();
            loadMessages();
        }

        // Create a new chat
        function createNewChat() {
            const chatId = 'chat-' + Date.now();
            const newChat = {
                id: chatId,
                title: 'New Chat',
                messages: [{
                    sender: 'assistant',
                    text: 'Hello! How can I help you today?',
                    timestamp: new Date().toLocaleString()
                }]
            };
            chats.unshift(newChat);
            localStorage.setItem('chats', JSON.stringify(chats));
            currentChatId = chatId;
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('chatId', chatId);
            window.history.pushState({}, '', newUrl);
            loadChatList();
            loadMessages();
        }

        // Send a message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const currentChat = chats.find(chat => chat.id === currentChatId);
            currentChat.messages.push({
                sender: 'user',
                text: text,
                timestamp: new Date().toLocaleString()
            });

            // Simulate AI response
            setTimeout(() => {
                currentChat.messages.push({
                    sender: 'assistant',
                    text: 'I am an AI assistant. I understand you said: ' + text,
                    timestamp: new Date().toLocaleString()
                });
                localStorage.setItem('chats', JSON.stringify(chats));
                loadMessages();
            }, 1000);

            messageInput.value = '';
            localStorage.setItem('chats', JSON.stringify(chats));
            loadMessages();
        }

        // Event Listeners
        sendButton.onclick = sendMessage;
        messageInput.onkeypress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };
        newChatButton.onclick = createNewChat;
        newChatHeaderBtn.onclick = createNewChat;

        // Handle shared chat URLs
        const urlParams = new URLSearchParams(window.location.search);
        const sharedChatId = urlParams.get('chatId');
        if (sharedChatId) {
            if (!chats.find(chat => chat.id === sharedChatId)) {
                const newChat = {
                    id: sharedChatId,
                    title: 'Shared Chat',
                    messages: [{
                        sender: 'assistant',
                        text: 'Hello! This is a shared chat. How can I help you today?',
                        timestamp: new Date().toLocaleString()
                    }]
                };
                chats.unshift(newChat);
                localStorage.setItem('chats', JSON.stringify(chats));
            }
            currentChatId = sharedChatId;
        }

        // Initial load
        loadChatList();
        loadMessages();
    </script>
</body>
</html>
